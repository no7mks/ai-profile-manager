version: "1"

abilities:
  # Rules
  - name: cursor-scope
    type: rule
    description: Cursor 平台专属规则
    targets:
      cursor: .cursor/rules/cursor-scope.mdc

  - name: kiro-scope
    type: rule
    description: Kiro 平台专属规则
    targets:
      kiro: .kiro/steering/kiro-scope.md

  - name: graphify
    type: rule
    description: 项目知识图谱使用指引
    targets:
      cursor: .cursor/rules/graphify.mdc
      kiro: .kiro/steering/graphify.md

  - name: writing-conventions
    type: rule
    description: 文档书写规范
    targets:
      cursor: .cursor/rules/doc/writing-conventions.mdc
      kiro: .kiro/steering/doc/writing-conventions.md

  - name: branch-overview
    type: rule
    description: GitFlow 分支模型总览
    targets:
      cursor: .cursor/rules/git/branch-overview.mdc
      kiro: .kiro/steering/git/branch-overview.md

  - name: git-conventions
    type: rule
    description: 日常 git 操作的基础规则
    targets:
      cursor: .cursor/rules/git/git-conventions.mdc
      kiro: .kiro/steering/git/git-conventions.md

  - name: superpowers-integration
    type: rule
    description: Superpowers 插件集成约束
    targets:
      cursor: .cursor/rules/plugin/superpowers-integration.mdc

  - name: command-safety
    type: rule
    description: Shell 命令安全约束
    targets:
      cursor: .cursor/rules/safety/command-safety.mdc
      kiro: .kiro/steering/safety/command-safety.md

  - name: config-safety
    type: rule
    description: 配置文件与敏感凭据安全约束
    targets:
      cursor: .cursor/rules/safety/config-safety.mdc
      kiro: .kiro/steering/safety/config-safety.md

  - name: spec-execution
    type: rule
    description: Spec task 执行规范
    targets:
      cursor: .cursor/rules/spec/spec-execution.mdc
      kiro: .kiro/steering/spec/spec-execution.md

  - name: spec-goal
    type: rule
    description: Spec goal 兼容入口
    targets:
      cursor: .cursor/rules/spec/spec-goal.mdc
      kiro: .kiro/steering/spec/spec-goal.md

  - name: spec-planning
    type: rule
    description: Spec planning 兼容入口
    targets:
      cursor: .cursor/rules/spec/spec-planning.mdc
      kiro: .kiro/steering/spec/spec-planning.md

  - name: manual-testing
    type: rule
    description: 手工测试执行规范
    targets:
      cursor: .cursor/rules/spec/manual-testing.mdc
      kiro: .kiro/steering/spec/manual-testing.md

  - name: kiro-spec-steering
    type: rule
    description: Kiro spec steering 占位
    targets:
      cursor: .cursor/rules/spec/kiro-spec-steering.mdc
      kiro: .kiro/steering/spec/kiro-spec-steering.md

  - name: gk-design
    type: rule
    description: Spec gatekeeper design 校验指引
    targets:
      kiro: .kiro/steering/spec/gk-design.md

  - name: gk-requirements
    type: rule
    description: Spec gatekeeper requirements 校验指引
    targets:
      kiro: .kiro/steering/spec/gk-requirements.md

  - name: gk-tasks
    type: rule
    description: Spec gatekeeper tasks 校验指引
    targets:
      kiro: .kiro/steering/spec/gk-tasks.md

  # Agents
  - name: code-reviewer
    type: agent
    description: 基于 diff 的 code review agent
    targets:
      cursor: .cursor/agents/code-reviewer.md
      kiro: .kiro/agents/code-reviewer.md

  - name: spec-planner
    type: agent
    description: Spec planning 执行器
    targets:
      cursor: .cursor/agents/spec-planner.md

  - name: spec-gatekeeper
    type: agent
    description: Spec 文档质量校验
    targets:
      kiro: .kiro/agents/spec-gatekeeper.md

  # Skills
  - name: apm
    type: skill
    description: apm CLI 的 Agent 执行手册
    targets:
      cursor: .cursor/skills/apm/
      kiro: .kiro/skills/apm/

  - name: gitflow
    type: skill
    description: GitFlow start/finish 统一执行
    targets:
      cursor: .cursor/skills/gitflow/
      kiro: .kiro/skills/gitflow/

  - name: graphify-skill
    type: skill
    description: Graphify 知识图谱构建与查询
    targets:
      cursor: .cursor/skills/graphify/
      kiro: .kiro/skills/graphify/

  - name: spec-planning-skill
    type: skill
    description: Spec planning 四阶段统一工作流
    targets:
      cursor: .cursor/skills/spec-planning/
      kiro: .kiro/skills/spec-planning/

  # Gitignore
  - name: gitignore-php
    type: gitignore
    description: PHP 相关忽略规则
    marker: "php"
    target: .gitignore

  - name: gitignore-graphify
    type: gitignore
    description: Graphify 输出忽略规则
    marker: "graphify"
    target: .gitignore

  - name: gitignore-python
    type: gitignore
    description: Python 相关忽略规则
    marker: "python"
    target: .gitignore

  - name: gitignore-kotlin
    type: gitignore
    description: Kotlin 相关忽略规则
    marker: "kotlin"
    target: .gitignore
