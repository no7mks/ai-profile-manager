version: "1"

rules:
  - path: cursor-scope
    description: Cursor 平台专属规则
    targets:
      cursor: .cursor/rules/cursor-scope.mdc

  - path: kiro-scope
    description: Kiro 平台专属规则
    targets:
      kiro: .kiro/steering/kiro-scope.md

  - path: doc:writing-conventions
    description: 文档书写规范
    targets:
      cursor: .cursor/rules/doc/writing-conventions.mdc
      kiro: .kiro/steering/doc/writing-conventions.md

  - path: doc:doc-convergence
    description: 文档归档操作规范
    targets:
      cursor: .cursor/rules/doc/doc-convergence.mdc
      kiro: .kiro/steering/doc/doc-convergence.md

  - path: git:branch-overview
    description: GitFlow 分支模型总览
    targets:
      cursor: .cursor/rules/git/branch-overview.mdc
      kiro: .kiro/steering/git/branch-overview.md

  - path: git:git-conventions
    description: 日常 git 操作的基础规则
    targets:
      cursor: .cursor/rules/git/git-conventions.mdc
      kiro: .kiro/steering/git/git-conventions.md

  - path: plugin:superpowers-integration
    description: Superpowers 插件集成约束
    targets:
      cursor: .cursor/rules/plugin/superpowers-integration.mdc

  - path: safety:command-safety
    description: Shell 命令安全约束
    targets:
      cursor: .cursor/rules/safety/command-safety.mdc
      kiro: .kiro/steering/safety/command-safety.md

  - path: safety:config-safety
    description: 配置文件与敏感凭据安全约束
    targets:
      cursor: .cursor/rules/safety/config-safety.mdc
      kiro: .kiro/steering/safety/config-safety.md

  - path: spec:e2e-testing
    description: E2E 测试执行规范
    targets:
      cursor: .cursor/rules/spec/e2e-testing.mdc
      kiro: .kiro/steering/spec/e2e-testing.md

  - path: gatekeeping:gk-design
    description: Spec gatekeeper design 校验指引
    targets:
      cursor: .cursor/rules/gatekeeping/gk-design.mdc
      kiro: .kiro/steering/gatekeeping/gk-design.md

  - path: gatekeeping:gk-requirements
    description: Spec gatekeeper requirements 校验指引
    targets:
      cursor: .cursor/rules/gatekeeping/gk-requirements.mdc
      kiro: .kiro/steering/gatekeeping/gk-requirements.md

  - path: gatekeeping:gk-tasks
    description: Spec gatekeeper tasks 校验指引
    targets:
      cursor: .cursor/rules/gatekeeping/gk-tasks.mdc
      kiro: .kiro/steering/gatekeeping/gk-tasks.md

agents:
  - path: code-reviewer
    description: 基于 diff 的 code review agent
    targets:
      cursor: .cursor/agents/code-reviewer.md
      kiro: .kiro/agents/code-reviewer.md

  - path: spec-gatekeeper
    description: Spec 文档质量校验
    targets:
      cursor: .cursor/agents/spec-gatekeeper.md
      kiro: .kiro/agents/spec-gatekeeper.md

skills:
  - path: apm
    description: apm CLI 的 Agent 执行手册
    targets:
      cursor: .cursor/skills/apm/
      kiro: .kiro/skills/apm/

  - path: gitflow
    description: GitFlow start/finish 统一执行
    targets:
      cursor: .cursor/skills/gitflow/
      kiro: .kiro/skills/gitflow/

  - path: graphify
    description: Graphify 知识图谱构建与查询
    targets:
      cursor: .cursor/skills/graphify/
      kiro: .kiro/skills/graphify/

  - path: spec-planning
    description: Spec planning 四阶段统一工作流
    targets:
      cursor: .cursor/skills/spec-planning/
      kiro: .kiro/skills/spec-planning/

  - path: spec-execution
    description: Spec task 执行规范
    targets:
      cursor: .cursor/skills/spec-execution/
      kiro: .kiro/skills/spec-execution/

gitignore:
  - marker: php
    description: PHP 相关忽略规则

  - marker: graphify
    description: Graphify 输出忽略规则

  - marker: python
    description: Python 相关忽略规则

  - marker: kotlin
    description: Kotlin 相关忽略规则

prompts:
  - name: graphify:project-section
    message: |
      在 PROJECT.md 的"版本号位置"章节之前插入以下内容（若"知识图谱"章节已存在则跳过）：

      ---

      ## 知识图谱

      本项目使用 graphify 维护持久化知识图谱（`graphify-out/`）。架构、依赖、模块耦合相关问题优先查图谱。

      ```
      /graphify init                   # 首次构建图谱
      /graphify update                 # 增量更新（仅变更文件）
      /graphify query "<question>"     # 查询关系
      /graphify path "A" "B"           # 两个概念间的最短路径
      /graphify explain "X"            # 解释单个节点
      ```

presets:
  - name: default
    description: Bootstrap 默认安装的能力
    includes:
      - skill:apm
      - agent:code-reviewer
      - rule:cursor-scope
      - rule:kiro-scope
      - rule:safety:command-safety
      - rule:safety:config-safety
      - rule:doc:writing-conventions
      - rule:doc:doc-convergence
      - rule:plugin:superpowers-integration

  - name: gitflow
    description: GitFlow 全套能力
    includes:
      - rule:git:branch-overview
      - rule:git:git-conventions
      - skill:gitflow

  - name: spec-core
    description: Spec 规划与执行全套
    includes:
      - skill:spec-execution
      - rule:spec:e2e-testing
      - rule:gatekeeping:gk-design
      - rule:gatekeeping:gk-requirements
      - rule:gatekeeping:gk-tasks
      - skill:spec-planning
      - agent:spec-gatekeeper

  - name: graphify
    description: Graphify 图谱能力
    includes:
      - skill:graphify
      - gitignore:graphify
      - prompt:graphify:project-section

  - name: php
    description: PHP 项目基础能力
    includes:
      - gitignore:php

  - name: python
    description: Python 项目基础能力
    includes:
      - gitignore:python

  - name: kotlin
    description: Kotlin 项目基础能力
    includes:
      - gitignore:kotlin
